<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>effects fixture</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  .card {
    width: 120px;
    height: 40px;
    margin: 12px;
    background: #3366cc;
    outline: 2px solid #ff0000;
    outline-offset: 2px;
    filter: blur(1px);
    mix-blend-mode: multiply;
  }
</style>
</head>

  <div class="card"></div>
</body>
</html>
