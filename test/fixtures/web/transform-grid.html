<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>transform and grid fixture</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
  .arrow {
    width: 7px;
    height: 7px;
    margin: 10px;
    border-right: 1px solid #333333;
    border-bottom: 1px solid #333333;
    transform: rotate(45deg);
    transform-origin: center;
  }
  .icon-button {
    display: grid;
    grid-template-columns: 32px;
    grid-template-rows: 32px;
    justify-items: center;
    align-items: center;
    width: 34px;
    height: 34px;
    margin: 10px;
    border: 1px solid #cccccc;
  }
  .icon-button .dot { width: 18px; height: 18px; background: #3366cc; }
</style>
</head>
<body>
  <div class="arrow"></div>
  <div class="icon-button"><span class="dot"></span></div>
</body>
</html>
