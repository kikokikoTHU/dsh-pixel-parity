<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #fff; }
  .panel { position: absolute; left: 20px; top: 80px; width: 120px; height: 40px; background: #3478f6; color: #fff; line-height: 40px; text-align: center; display: none; }
  .panel.open { display: block; }
  #reveal { position: absolute; left: 20px; top: 20px; width: 80px; height: 28px; }
</style></head>
<body>
  <button id="reveal" data-parity="reveal">Open</button>
  <div class="panel" data-parity="panel">ready</div>
  <script>
    document.getElementById('reveal').addEventListener('click', event => {
      event.currentTarget.style.display = 'none'
      document.querySelector('.panel').classList.add('open')
    })
  </script>
</body></html>
